<!--imagewithtext.html-->


<ul class="image-with-text-block">
    {% for block in block_content %}
    <li>
        <img class="w-12 h-12" src="{{ block.image.url }}" alt="">
        <p class="bg-yellow-500">{{ block.text }}</p>
    </li>
    {% endfor %}
</ul> 

{% comment %} {% if options.display %}

    <div class="card card-compact bg-base-100 w-96 shadow-xl">
        <figure>
        <img
            src="{{ block.image.url }}"
            alt="" />
        </figure>
        <div class="card-body">
        {% if block_content.title %}
            <h2 class="card-title">{{ block_content.title|safe }}</h2>
        {% endif %}

        <p>{{ block_content.text|safe }}</p>

        </div>
    </div>

{% endif %} {% endcomment %}
