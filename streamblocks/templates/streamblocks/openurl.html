<!-- openurl.html -->
{% if options.display %}
<div class="card-body flex flex-col relative !overflow-visible"> <!-- Agregado overflow-visible y padding -->
  <div class="flex items-center">
    <p class="mr-4">{{ block_content.text }}</p>
    <div class="card-actions">
      <a href="{{ block_content.url }}" target="_blank" class="btn btn-xs btn-outline btn-accent text-white px-10">Abrir</a>
    </div>
  </div>

  {% if block_content.url2 %}
    <div class="flex items-center bg-gray-100">
      <p class="mr-4">{{ block_content.text2 }}</p>
      <div class="card-actions">
        <a href="{{ block_content.url2 }}" target="_blank" class="btn btn-xs btn-outline btn-accent text-white px-10">Abrir</a>
      </div>
    </div>
  {% endif %}

  {% if block_content.url3 %}
    <div class="flex items-center">
      <p class="mr-4">{{ block_content.text3 }}</p>
      <div class="card-actions">
        <a href="{{ block_content.url3 }}" target="_blank" class="btn btn-xs btn-outline btn-accent text-white px-10">Abrir</a>
      </div>
    </div>
  {% endif %}

  <div class="absolute top-0 right-0 translate-x-1/4 -translate-y-1/4 border-2 p-2 w-10 h-10 rounded-full bg-blue-700 text-white border-white"> <!-- Ajustado para desbordamiento visual -->
    <svg viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-dasharray="28" stroke-dashoffset="28" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 6l2 -2c1 -1 3 -1 4 0l1 1c1 1 1 3 0 4l-5 5c-1 1 -3 1 -4 0M11 18l-2 2c-1 1 -3 1 -4 0l-1 -1c-1 -1 -1 -3 0 -4l5 -5c1 -1 3 -1 4 0">
        <animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="28;0" />
      </path>
    </svg>
  </div>
</div>

{% endif %}
